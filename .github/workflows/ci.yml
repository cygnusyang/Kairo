name: ci

# push / PR 触发；发版路径由 release.yml 负责，这里不重复。
on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: test · macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode（Swift Testing 需要 16+）
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 工具链版本
        run: swift --version

      - name: 缓存 .build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-

      - name: 测试
        run: swift test

      - name: 门禁 · 核心层不得依赖 UI 框架（ADR-004 / ADR-013）
        run: bash tools/gate-core.sh

      - name: 门禁 · 视图层不得直接引用核心模型（ADR-013）
        run: bash tools/gate-ui.sh

      - name: 门禁 · 多语言（硬编码中文 / Bundle.module / 键完整性）
        run: |
          set -euo pipefail
          CATALOG="Apps/macos/Resources/Localizable.xcstrings"
          if [[ -f "$CATALOG" ]]; then
            bash tools/i18n-compile.sh "$RUNNER_TEMP/kairo-lproj"
            bash tools/i18n-lint.sh --lproj-dir "$RUNNER_TEMP/kairo-lproj"
          else
            echo "::notice title=i18n::未找到 ${CATALOG}（F-0705 未交付），跳过键与占位符检查；硬编码中文与 Bundle.module 两项照常执行"
            bash tools/i18n-lint.sh --skip-catalog
          fi

  linux:
    name: test · Linux（核心与接口层）
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4

      - name: 工具链版本
        run: swift --version

      - name: 缓存 .build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-

      - name: 门禁 · 核心层不得依赖 UI 框架（ADR-004）
        run: bash tools/gate-core.sh

      - name: 测试（App / GUI target 在 Linux 不参与构建）
        run: swift test
